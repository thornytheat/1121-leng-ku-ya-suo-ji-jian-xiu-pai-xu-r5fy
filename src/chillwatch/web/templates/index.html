<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冷库压缩机检修排序</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/components.css">
  <link rel="stylesheet" href="/static/layout.css">
  <script defer src="/static/visual-data.js"></script>
  <script defer src="/static/workbench.js"></script>
</head>
<body data-project="chillwatch">
  <a href="#main" class="skip">跳到业务结果</a>
  <div class="shell">
    <aside class="rail">
      <h2>冷库机务</h2>
      <nav aria-label="业务环节">
        {% for slug, label in modules %}<button type="button" data-stage="{{ slug }}" aria-pressed="false">{{ label }}</button>{% endfor %}
      </nav>
    </aside>
    <main class="content" id="main">
      <header class="masthead">
        <h1>冷库压缩机检修排序</h1>
        <form id="scenario" class="scenario">
          <label for="capacity">检修工位（个）<input id="capacity" placeholder="输入额度" required type="number" min="1" max="100" step="1" inputmode="numeric"></label>
          <button id="submit" class="primary" type="submit" disabled>重排检修</button>
          <button class="quiet" id="export" type="button" disabled>导出</button>
        </form>
      </header>
      <dl class="kpis" id="metrics" aria-label="本批指标"></dl>
      <div class="board">
        <section class="panel signal" aria-labelledby="chart-heading">
          <div class="panel-heading"><h2 id="chart-heading">异常信号</h2><p>信号强度</p></div>
          <div class="chart" id="chart" data-axis="信号强度"></div>
        </section>
        <section id="evidence" class="panel evidence" aria-labelledby="evidence-heading">
          <div class="panel-heading"><h2 id="evidence-heading" tabindex="-1">下发前复核</h2><p id="evidence-summary"></p></div>
          <div id="stage-records" class="table-scroll" tabindex="0" role="region" aria-label="环节证据"></div>
        </section>
        <section class="panel decisions" aria-labelledby="decision-heading">
          <div class="panel-heading"><h2 id="decision-heading">待检修设备</h2><p id="row-count"></p>
          <input id="row-filter" type="search" autocomplete="off" aria-label="筛选记录" placeholder="筛选记录"></div>
          <div id="rows" class="table-scroll" tabindex="0" role="region" aria-label="待检修设备"></div>
        </section>
      </div>
      <footer class="statusbar">
        <span id="status" role="status">正在载入样例</span>
        <span>运行指纹 <code id="run-id">—</code> · <a href="/api/overview">运行数据</a></span>
      </footer>
    </main>
  </div>
</body>
</html>
